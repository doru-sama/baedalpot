<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배달팟 🍜 공동주문 모집 & 메뉴 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #ff5c00;
    --accent2: #ffcc00;
    --green: #00e676;
    --blue: #40c4ff;
    --text: #f0f0f0;
    --muted: #888;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: -1px;
  }
  .logo span { color: var(--accent2); }
  header p { color: var(--muted); font-size: 0.85rem; }

  .header-auth {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .header-auth .btn {
    padding: 8px 14px;
    font-size: 0.82rem;
  }
  .header-auth-status {
    color: var(--muted);
    font-size: 0.82rem;
    margin-right: 4px;
    white-space: nowrap;
  }
  .header-auth-status strong { color: var(--accent2); }
  .auth-card {
    max-width: 430px;
    margin: 40px auto;
  }
  .auth-guide {
    color: var(--muted);
    font-size: .86rem;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  @media(max-width: 760px) {
    header { align-items: flex-start; flex-direction: column; }
    .header-auth { width: 100%; justify-content: flex-start; }
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
  }
  .tab {
    padding: 14px 28px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: all .2s;
    user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  /* ── LAYOUT ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 32px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── FORM ── */
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
  label { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }

  /* ── BUTTONS ── */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn:hover { background: #ff7733; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,92,0,.4); }
  .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
  .btn.green { background: var(--green); color: #000; }
  .btn.green:hover { background: #33ee88; box-shadow: 0 4px 20px rgba(0,230,118,.3); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ── MENU GRID ── */
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .menu-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: all .2s;
    cursor: pointer;
    position: relative;
  }
  .menu-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .menu-card.selected { border-color: var(--green); background: rgba(0,230,118,.06); }
  .menu-card .emoji { font-size: 2rem; margin-bottom: 8px; }
  .menu-card .name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
  .menu-card .price { color: var(--accent); font-family: 'Space Mono', monospace; font-size: 0.9rem; }
  .menu-card .category { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .menu-card .match-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--green); color: #000;
    font-size: 0.65rem; font-weight: 800;
    padding: 2px 7px; border-radius: 20px;
  }

  /* ── TAG PILLS ── */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2);
    transition: all .2s;
    user-select: none;
  }
  .tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag:hover:not(.active) { border-color: var(--muted); }

  /* ── RESULTS ── */
  .result-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
  }
  .result-box.success { border-color: var(--green); }
  .result-box.warn { border-color: var(--accent2); }

  /* ── POT SECTION ── */
  .user-list { display: flex; flex-direction: column; gap: 10px; }
  .user-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .user-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: #fff; flex-shrink: 0;
  }
  .user-info { flex: 1; }
  .user-name { font-weight: 700; font-size: 0.9rem; }
  .user-budget { color: var(--accent); font-family: 'Space Mono', monospace; font-size: 0.85rem; }
  .user-category { font-size: 0.75rem; color: var(--muted); }
  .remove-btn { background: none; border: 1px solid #333; color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .remove-btn:hover { border-color: #e53935; color: #e53935; }

  /* ── POT MATCH RESULT ── */
  .pot-result {
    border: 2px solid var(--green);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
    background: rgba(0,230,118,.04);
    animation: fadeIn .4s ease;
  }
  .pot-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .pot-title { font-size: 1.1rem; font-weight: 800; color: var(--green); }
  .members-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .member-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    flex: 1; min-width: 120px;
    text-align: center;
  }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); font-weight: 700; }
  .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

  /* ── CHART ── */
  .chart-container { margin-top: 20px; }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { width: 100px; font-size: 0.82rem; color: var(--muted); text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 22px; overflow: hidden; }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    display: flex; align-items: center; padding-left: 8px;
    font-size: 0.75rem; font-weight: 700;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }
  .bar-count { width: 40px; font-size: 0.82rem; color: var(--muted); font-family: 'Space Mono', monospace; }

  /* ── NOTICE ── */
  .notice {
    background: rgba(255,92,0,.08);
    border: 1px solid rgba(255,92,0,.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 12px;
  }
  .notice strong { color: var(--accent2); }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .empty .big { font-size: 3rem; margin-bottom: 12px; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .fadeIn { animation: fadeIn .4s ease; }

  /* ── DIVIDER ── */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* ── STATUS BADGE ── */
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 700;
  }
  .badge.green { background: rgba(0,230,118,.15); color: var(--green); }
  .badge.orange { background: rgba(255,92,0,.15); color: var(--accent); }
  .badge.yellow { background: rgba(255,204,0,.15); color: var(--accent2); }

  /* ── TWO COL ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width: 700px) { .two-col { grid-template-columns: 1fr; } .main { padding: 16px; } }

  /* ── RANGE ── */
  input[type=range] {
    padding: 0; height: 6px;
    accent-color: var(--accent);
  }
  .range-val { font-family: 'Space Mono', monospace; color: var(--accent); font-weight: 700; font-size: 1rem; }

  /* ── BOARD ── */
  .board-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  @media(max-width:800px){ .board-layout { grid-template-columns: 1fr; } }
  .board-sidebar { display: flex; flex-direction: column; gap: 14px; }
  .board-list { display: flex; flex-direction: column; gap: 12px; }
  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: all .2s;
    animation: fadeIn .3s ease;
  }
  .post-card:hover { border-color: var(--accent); transform: translateX(3px); }
  .post-card.post-full { opacity: .55; }
  .post-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .post-cat-badge {
    padding: 3px 11px; border-radius: 20px;
    font-size: .72rem; font-weight: 800;
    background: rgba(255,92,0,.15); color: var(--accent);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .post-time { font-size: .72rem; color: var(--muted); font-family: 'Space Mono', monospace; white-space: nowrap; }
  .post-title { font-weight: 800; font-size: .97rem; margin-bottom: 5px; }
  .post-msg { font-size: .82rem; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .post-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: .75rem; color: var(--muted); }
  .chip strong { color: var(--text); }
  .progress-bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .5s; }
  .progress-fill.almost { background: var(--accent2); }
  .progress-fill.full-fill { background: #e53935; }
  .progress-label { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
  .join-btn {
    width: 100%; margin-top: 10px;
    background: var(--surface2); color: var(--green);
    border: 1px solid rgba(0,230,118,.3);
    padding: 8px; border-radius: 8px;
    font-size: .85rem; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .join-btn:hover { background: rgba(0,230,118,.08); }
  .join-btn:disabled { opacity: .4; cursor: not-allowed; }
  .my-badge { font-size: .7rem; background: rgba(255,204,0,.12); color: var(--accent2); border: 1px solid rgba(255,204,0,.25); padding: 2px 8px; border-radius: 20px; }
  .board-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .board-empty .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
  .board-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .board-filter {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 5px 13px; border-radius: 20px;
    font-size: .78rem; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .board-filter.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 14px;
    font-size: .9rem; font-family: inherit; outline: none;
    resize: none; height: 65px; width: 100%;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }


  /* ── CHAT ── */
  .chat-box {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    padding: 12px;
  }
  .chat-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .chat-title { font-size:.82rem; font-weight:800; color:var(--accent2); }
  .chat-messages {
    max-height: 150px; overflow-y:auto; display:flex; flex-direction:column; gap:7px;
    padding: 8px; background: var(--surface2); border-radius:8px; margin-bottom:8px;
  }
  .chat-msg { font-size:.78rem; line-height:1.45; color:var(--text); }
  .chat-msg strong { color:var(--green); margin-right:5px; }
  .chat-empty { color:var(--muted); font-size:.78rem; text-align:center; padding:10px; }
  .chat-form { display:flex; gap:6px; }
  .chat-form input { flex:1; padding:7px 10px; font-size:.82rem; }
  .chat-form button { padding:7px 12px; font-size:.8rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--text); padding: 12px 20px; border-radius: 10px;
    font-size: .88rem; font-weight: 600; z-index: 9999;
    animation: fadeIn .3s ease; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .toast.err { border-color: #e53935; color: #e53935; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">배달<span>팟</span>.zip</div>
    <p>미래캠퍼스 공동주문 모집 & 메뉴 추천 앱 | ACE 8조</p>
  </div>
  <div class="header-auth">
    <span id="loginStatus" class="header-auth-status">로그인 필요</span>
    <button id="loginTopBtn" class="btn secondary" onclick="goLogin()">로그인</button>
    <button id="signupTopBtn" class="btn" onclick="goSignup()">회원가입</button>
    <button id="logoutTopBtn" class="btn secondary" onclick="logout()" style="display:none;">로그아웃</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="recommend" onclick="showTab('recommend')">🍽️ 메뉴 추천</div>

  <div class="tab" data-tab="board" onclick="showTab('board')">📋 모집 게시판</div>
</div>

<div class="main">

  <!-- ══════════════════ AUTH: 로그인 ══════════════════ -->
  <div id="page-login" class="page">
    <div class="card auth-card">
      <div class="card-title">🔐 로그인</div>
      <p class="auth-guide">이미 가입한 이름과 비밀번호를 입력하세요. 로그인 후 모집글 작성, 참여, 채팅 기능을 사용할 수 있습니다.</p>
      <div class="form-group" style="margin-bottom:12px;">
        <label>이름</label>
        <input type="text" id="loginName" placeholder="예: 홍길동" maxlength="20">
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호" maxlength="30" onkeydown="if(event.key==='Enter') login()">
      </div>
      <div class="btn-row">
        <button class="btn" onclick="login()">로그인</button>
        <button class="btn secondary" onclick="goSignup()">회원가입 화면으로</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ AUTH: 회원가입 ══════════════════ -->
  <div id="page-signup" class="page">
    <div class="card auth-card">
      <div class="card-title">📝 회원가입</div>
      <div class="form-group" style="margin-bottom:12px;">
        <label>이름</label>
        <input type="text" id="signupName" placeholder="예: 홍길동" maxlength="20">
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>비밀번호</label>
        <input type="password" id="signupPassword" placeholder="비밀번호" maxlength="30" onkeydown="if(event.key==='Enter') signup()">
      </div>
      <div class="btn-row">
        <button class="btn" onclick="signup()">회원가입</button>
        <button class="btn secondary" onclick="goLogin()">로그인 화면으로</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ PAGE 1: 메뉴 추천 ══════════════════ -->
  <div id="page-recommend" class="page active">

    <div class="card">
      <div class="card-title">🎯 내 조건 입력</div>
      <div class="form-row">
        <div class="form-group">
          <label>예산 (원)</label>
          <input type="number" id="myBudget" placeholder="15000" min="0" step="500" value="15000">
        </div>
      </div>

      <div class="card-title" style="margin-top:8px;">🏷️ 카테고리 필터</div>
      <div class="tags" id="categoryTags">
        <div class="tag active" onclick="toggleTag(this,'전체')">전체</div>
        <div class="tag" onclick="toggleTag(this,'치킨')">🍗 치킨</div>
        <div class="tag" onclick="toggleTag(this,'돈까스/회')">🍱 돈까스/회</div>
        <div class="tag" onclick="toggleTag(this,'고기')">🥩 고기</div>
        <div class="tag" onclick="toggleTag(this,'도시락')">🍱 도시락</div>
        <div class="tag" onclick="toggleTag(this,'양식')">🍝 양식</div>
        <div class="tag" onclick="toggleTag(this,'아시안')">🍜 아시안</div>
        <div class="tag" onclick="toggleTag(this,'피자')">🍕 피자</div>
        <div class="tag" onclick="toggleTag(this,'커피/디저트')">☕ 커피/디저트</div>
        <div class="tag" onclick="toggleTag(this,'한식')">🍚 한식</div>

function showTab(name, remember = true) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  const page = document.getElementById('page-' + name);
  const tab = document.querySelector(`.tab[data-tab="${name}"]`) || document.querySelector(`.tab[onclick*="${name}"]`);
  if (!page) return;

  page.classList.add('active');
  if (tab) tab.classList.add('active');

  if (remember && (name === 'recommend' || name === 'board')) {
    localStorage.setItem('baedalpot_active_tab', name);
  }

  if (name === 'board') renderBoard();
}

function restoreActiveTab() {
  const saved = localStorage.getItem('baedalpot_active_tab') || 'recommend';
  const target = document.getElementById('page-' + saved) ? saved : 'recommend';
  showTab(target);
}

function goLogin() {
  showTab('login', false);
}

function goSignup() {
  showTab('signup', false);
}

function toggleTag(el, cat) {
  document.querySelectorAll('#categoryTags .tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  selectedCategory = cat;
  renderAllStores();
}

function sortMenus(list, sortType) {
  const sorted = [...list];
  if (sortType === 'priceDesc') sorted.sort((a,b) => b.price - a.price || a.name.localeCompare(b.name, 'ko'));
  else if (sortType === 'minOrderAsc') sorted.sort((a,b) => a.minOrder - b.minOrder || a.price - b.price);
  else if (sortType === 'nameAsc') sorted.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  else sorted.sort((a,b) => a.price - b.price || a.name.localeCompare(b.name, 'ko'));
  return sorted;
}

function renderMenuCard(m, extra = '') {
  const canSolo = m.minOrder <= (parseInt(document.getElementById('myBudget').value) || 15000);
  return `<div class="menu-card">
    <div class="emoji">${m.emoji}</div>
    <div class="name">${escapeHtml(m.name)}</div>
    <div class="category" style="margin-top:8px;">${escapeHtml(m.category)} · 최소주문 ${m.minOrder.toLocaleString()}원${m.deliveryFee ? ` · 배달비 ${m.deliveryFee.toLocaleString()}원` : ''}</div>
    ${extra}
    ${canSolo ? '<div class="match-badge">예산OK</div>' : '<span class="badge yellow" style="margin-top:6px;font-size:.7rem;">공동주문 추천</span>'}
  </div>`;
}

function pickRandomItems(arr, limit) {
  return [...arr]
    .sort(() => Math.random() - 0.5)
    .slice(0, limit);
}

function renderAllStores() {
  const result = document.getElementById('recommendResult');
  if (!result) return;
  const sortMode = document.getElementById('recommendSort')?.value || 'priceAsc';
  const filtered = MENUS.filter(m => selectedCategory === '전체' || m.category === selectedCategory);
  const stores = sortMenus(filtered, sortMode);
  const categoryLabel = selectedCategory === '전체' ? '전체 카테고리' : selectedCategory;

  let html = `<div class="result-box fadeIn">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <span style="font-size:1.4rem;">🍽️</span>
      <div>
        <div style="font-weight:800;font-size:1rem;">${escapeHtml(categoryLabel)} 가게 목록</div>
        <div style="color:var(--muted);font-size:.82rem;margin-top:2px;">추천받기 전에는 전체 가게를 보여줍니다 · ${stores.length}개</div>
      </div>
    </div>`;

  if (!stores.length) {
    html += `<div class="notice">⚠️ 선택한 카테고리에 등록된 가게가 없습니다.</div>`;
  } else {
    html += `<div class="menu-grid">`;
    stores.forEach(m => { html += renderMenuCard(m); });
    html += `</div>`;
  }
  html += `</div>`;
  result.innerHTML = html;
}

function recommendMenus() {
  const budget = parseInt(document.getElementById('myBudget').value) || 15000;
  const sortMode = document.getElementById('recommendSort')?.value || 'priceAsc';
  const showAll = document.getElementById('showAllStores')?.checked || false;
  const limit = 5;

  const filtered = MENUS.filter(m => selectedCategory === '전체' || m.category === selectedCategory);
  const possibleStores = filtered.filter(m => m.price <= budget);

  const sortPicked = (arr) => {
    const copied = [...arr];
    if (sortMode === 'priceDesc') copied.sort((a, b) => b.price - a.price || a.name.localeCompare(b.name, 'ko'));
    else copied.sort((a, b) => a.price - b.price || a.name.localeCompare(b.name, 'ko'));
    return copied;
  };

  const pickedStores = showAll
    ? sortPicked(possibleStores)
    : sortPicked(pickRandomItems(possibleStores, limit));

  const categoryLabel = selectedCategory === '전체' ? '전체 카테고리' : selectedCategory;
  const modeText = showAll ? '가능한 가게 전체 보기' : `랜덤 ${Math.min(limit, possibleStores.length)}개 추천`;

  let html = `<div class="result-box success fadeIn">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <span style="font-size:1.4rem;">✨</span>
      <div>
        <div style="font-weight:800;font-size:1rem;">예산 <span style="color:var(--accent);font-family:'Space Mono',monospace;">${budget.toLocaleString()}원</span> 기준 추천</div>
        <div style="color:var(--muted);font-size:.82rem;margin-top:2px;">${escapeHtml(categoryLabel)} · 예산 내 가능 ${possibleStores.length}개 · ${modeText}</div>
      </div>
    </div>`;

  if (filtered.length === 0) {
    html += `<div class="notice">⚠️ 조건에 맞는 식당이 없습니다. 카테고리를 바꿔보세요.</div>`;
  } else if (possibleStores.length === 0) {
    html += `<div class="notice">⚠️ 선택한 조건에서 예산 안에 들어오는 식당이 없습니다. 예산을 늘리거나 카테고리를 바꿔보세요.</div>`;
  } else {
    html += `<div style="font-weight:700;margin-bottom:10px;color:var(--green);">✅ 추천 식당</div>`;
    html += `<div class="menu-grid">`;
    pickedStores.forEach(m => {
      html += renderMenuCard(m);
    });
    html += `</div>`;
  }

  html += `</div>`;
  document.getElementById('recommendResult').innerHTML = html;
}

function resetRecommend() {
  document.getElementById('myBudget').value = '15000';
  if (document.getElementById('recommendSort')) document.getElementById('recommendSort').value = 'priceAsc';
  if (document.getElementById('showAllStores')) document.getElementById('showAllStores').checked = false;
  document.querySelectorAll('#categoryTags .tag').forEach(t => t.classList.remove('active'));
  document.querySelector('#categoryTags .tag').classList.add('active');
  selectedCategory = '전체';
  renderAllStores();
}

// ══════════════════════════════════════
// BOARD (server API + simple auth)
// ══════════════════════════════════════
const API_BASE = '/api';
let boardFilter = '전체';
let cachedPosts = [];
const chatTimers = {};
const chatCache = {};

function getAuth() {
  try { return JSON.parse(localStorage.getItem('baedalpot_user') || 'null'); }
  catch(e) { return null; }
}
function setAuth(user) {
  localStorage.setItem('baedalpot_user', JSON.stringify(user));
  updateLoginStatus();
}
function clearAuth() {
  localStorage.removeItem('baedalpot_user');
  updateLoginStatus();
}
function authHeaders() {
  const user = getAuth();
  if (!user) return {};
  return { 'Authorization': `Bearer ${user.token}`, 'X-User-Id': String(user.id) };
}
async function apiRequest(url, options = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(options.headers || {}) },
    ...options
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '서버 요청 실패');
  return data;
}
function updateLoginStatus() {
  const user = getAuth();
  const status = document.getElementById('loginStatus');
  const loginBtn = document.getElementById('loginTopBtn');
  const signupBtn = document.getElementById('signupTopBtn');
  const logoutBtn = document.getElementById('logoutTopBtn');

  if (user) {
    status.innerHTML = `<strong>${escapeHtml(user.name)}</strong>님 로그인 중`;
    if (loginBtn) loginBtn.style.display = 'none';
    if (signupBtn) signupBtn.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = '';
  } else {
    status.textContent = '로그인 필요';
    if (loginBtn) loginBtn.style.display = '';
    if (signupBtn) signupBtn.style.display = '';
    if (logoutBtn) logoutBtn.style.display = 'none';
  }
}

async function signup() {
  const name = document.getElementById('signupName').value.trim();
  const password = document.getElementById('signupPassword').value.trim();
  if (!name || !password) { showToast('이름과 비밀번호를 입력해주세요', true); return; }
  try {
    await apiRequest(`${API_BASE}/auth/signup`, { method:'POST', body: JSON.stringify({ name, password }) });
    document.getElementById('signupName').value = '';
    document.getElementById('signupPassword').value = '';
    showToast('회원가입 완료. 로그인해주세요.');
    goLogin();
  } catch(e) { showToast(e.message, true); }
}

async function login() {
  const name = document.getElementById('loginName').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if (!name || !password) { showToast('이름과 비밀번호를 입력해주세요', true); return; }
  try {
    const user = await apiRequest(`${API_BASE}/auth/login`, { method:'POST', body: JSON.stringify({ name, password }) });
    setAuth(user);
    document.getElementById('loginPassword').value = '';
    showToast('로그인 완료');
    showTab(localStorage.getItem('baedalpot_active_tab') || 'board');
    await renderBoard();
  } catch(e) { showToast(e.message, true); }
}

function logout() {
  clearAuth();
  showToast('로그아웃 완료');
  renderBoard();
}

async function getBoardPosts() {
  const q = boardFilter === '전체' ? '' : `?cat=${encodeURIComponent(boardFilter)}`;
  cachedPosts = await apiRequest(`${API_BASE}/posts${q}`);
  return cachedPosts;
}
function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '방금 전';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}
function formatDeadline(ts) {
  if (!ts) return '마감 없음';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function deadlineToISO(localValue) {
  if (!localValue) return '';
  const d = new Date(localValue);
  return d.toISOString();
}
async function submitPost() {
  const user = getAuth();
  if (!user) { showToast('글을 올리려면 로그인해주세요', true); return; }
  const deadline = document.getElementById('bDeadline').value;
  if (!deadline) { showToast('마감시간을 설정해주세요', true); return; }
  try {
    await apiRequest(`${API_BASE}/posts`, {
      method: 'POST',
      body: JSON.stringify({
        cat: document.getElementById('bCat').value,
        menu: document.getElementById('bMenu').value.trim(),
        budget: parseInt(document.getElementById('bBudget').value) || 15000,
        size: parseInt(document.getElementById('bSize').value),
        deadline_at: deadlineToISO(deadline),
        msg: document.getElementById('bMsg').value.trim()
      })
    });
    document.getElementById('bMenu').value = '';
    document.getElementById('bMsg').value = '';
    await renderBoard();
    showToast('팟 모집 글이 올라갔어요! 🎉');
  } catch (e) { showToast(e.message, true); }
}
async function joinPost(id) {
  if (!getAuth()) { showToast('참여하려면 로그인해주세요', true); return; }
  try {
    await apiRequest(`${API_BASE}/posts/${id}/join`, { method:'POST', body: JSON.stringify({}) });
    await renderBoard();
    showToast('팟에 참여했어요! 🙌');
  } catch(e) { showToast(e.message, true); }
}
async function deletePost(id) {
  if (!getAuth()) { showToast('삭제하려면 로그인해주세요', true); return; }
  if (!confirm('이 모집글을 삭제할까요?')) return;
  try {
    await apiRequest(`${API_BASE}/posts/${id}`, { method:'DELETE' });
    await renderBoard();
    showToast('게시글이 삭제됐어요');
  } catch(e) { showToast(e.message, true); }
}
function setBoardFilter(cat, el) {
  boardFilter = cat;
  document.querySelectorAll('.board-filter').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderBoard();
}
function isParticipant(post, user) {
  if (!user) return false;
  return (post.participants || []).some(x => String(x.user_id) === String(user.id));
}
async function toggleChat(id) {
  const box = document.getElementById(`chat-${id}`);
  if (!box) return;
  if (box.style.display === 'none' || !box.style.display) {
    box.style.display = 'block';
    await loadMessages(id);
    startChatLive(id);
  } else {
    box.style.display = 'none';
    stopChatLive(id);
  }
}
function startChatLive(id) {
  stopChatLive(id);
  chatTimers[id] = setInterval(() => {
    const box = document.getElementById(`chat-${id}`);
    if (!box || box.style.display === 'none') {
      stopChatLive(id);
      return;
    }
    loadMessages(id, true);
  }, 1500);
}
function stopChatLive(id) {
  if (chatTimers[id]) {
    clearInterval(chatTimers[id]);
    delete chatTimers[id];
  }
}
async function loadMessages(id, silent = false) {
  const el = document.getElementById(`chatMessages-${id}`);
  if (!el) return;
  if (!silent) el.innerHTML = '<div class="chat-empty">불러오는 중...</div>';
  try {
    const messages = await apiRequest(`${API_BASE}/posts/${id}/messages`);
    let html = '';
    if (!messages.length) html = '<div class="chat-empty">아직 채팅이 없습니다.</div>';
    else html = messages.map(m => `<div class="chat-msg"><strong>${escapeHtml(m.nickname)}</strong>${escapeHtml(m.message)}</div>`).join('');
    if (chatCache[id] !== html) {
      chatCache[id] = html;
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }
  } catch (e) {
    if (!silent) el.innerHTML = `<div class="chat-empty">${escapeHtml(e.message)}</div>`;
  }
}
async function sendMessage(id) {
  const input = document.getElementById(`chatInput-${id}`);
  const message = input ? input.value.trim() : '';
  if (!getAuth()) { showToast('채팅하려면 로그인해주세요', true); return; }
  if (!message) { showToast('메시지를 입력해주세요', true); return; }
  try {
    await apiRequest(`${API_BASE}/posts/${id}/messages`, { method:'POST', body: JSON.stringify({ message }) });
    input.value = '';
    await loadMessages(id);
  } catch(e) { showToast(e.message, true); }
}
function escapeHtml(text) {
  return String(text || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
async function renderBoard() {
  updateLoginStatus();
  const el = document.getElementById('boardList');
  if (!el) return;
  el.innerHTML = `<div class="board-empty"><span class="big">⏳</span>게시글을 불러오는 중...</div>`;
  let list = [];
  try { list = await getBoardPosts(); }
  catch(e) {
    document.getElementById('boardCount').textContent = '0';
    el.innerHTML = `<div class="board-empty"><span class="big">⚠️</span>서버에 연결할 수 없어요.<br>${escapeHtml(e.message)}</div>`;
    return;
  }
  document.getElementById('boardCount').textContent = list.length;
  if (list.length === 0) {
    el.innerHTML = `<div class="board-empty"><span class="big">🍽️</span>${boardFilter === '전체' ? '아직 모집 글이 없어요. 첫 번째 팟을 만들어보세요!' : boardFilter + ' 카테고리 글이 없어요'}</div>`;
    return;
  }
  const user = getAuth();
  const catColors = {치킨:'#ff9f43','돈까스/회':'#f9ca24',고기:'#eb4d4b',도시락:'#6ab04c',양식:'#e056fd',아시안:'#22a6b3',피자:'#ee5a24','커피/디저트':'#c7a17a',한식:'#badc58',중식:'#f0932b',패스트푸드:'#30336b',분식:'#be2edd'};
  el.innerHTML = list.map(p => {
    const pct = Math.round(p.joined / p.size * 100);
    const isFull = p.joined >= p.size;
    const mine = user && String(p.user_id) === String(user.id);
    const participant = isParticipant(p, user);
    const expired = !!p.expired;
    const fillClass = (isFull || expired) ? 'full-fill' : pct >= 67 ? 'almost' : '';
    const col = catColors[p.cat] || 'var(--accent)';
    const chatDisabled = !participant || expired;
    return `<div class="post-card${(isFull || expired) ? ' post-full' : ''}">
      <div class="post-top">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
          <span class="post-cat-badge" style="background:${col}22;color:${col};">${escapeHtml(p.cat)}</span>
          ${mine ? '<span class="my-badge">내 글</span>' : ''}
          ${participant ? '<span class="my-badge">참여 중</span>' : ''}
        </div>
        <span class="post-time">${timeAgo(p.ts)}</span>
      </div>
      <div class="post-title">${escapeHtml(p.menu || p.cat + ' 팟 모집')}</div>
      ${p.msg ? `<div class="post-msg">${escapeHtml(p.msg)}</div>` : ''}
      <div class="post-chips">
        <div class="chip">👤 <strong>${escapeHtml(p.author)}</strong></div>
        <div class="chip">💰 <strong>${p.budget.toLocaleString()}원</strong>/인</div>
        <div class="chip">⏰ <strong>${formatDeadline(p.deadline_ts)}</strong></div>
        <div class="chip">참여자: ${(p.participants||[]).map(x=>escapeHtml(x.nickname)).join(', ') || '-'}</div>
      </div>
      <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${Math.min(pct,100)}%"></div></div>
      <div class="progress-label"><span>참여 ${p.joined}/${p.size}명</span><span>${expired ? '⏰ 마감시간 지남' : isFull ? '🔴 인원 마감' : '🟢 모집 중'}</span></div>
      ${(!isFull && !expired && !mine && !participant) ? `<button class="join-btn" onclick="joinPost('${p.id}')">✅ 참여하기</button>` : `<button class="join-btn" disabled>${mine ? '✏️ 내 글' : participant ? '✅ 참여 완료' : expired ? '마감됨' : '마감됨'}</button>`}
      <button class="join-btn" style="color:var(--accent2);border-color:rgba(255,204,0,.3);" onclick="toggleChat('${p.id}')" ${chatDisabled ? 'disabled title="참여 중인 모집글에서만, 마감 전까지 채팅할 수 있어요"' : ''}>💬 채팅</button>
      ${mine ? `<button class="join-btn" style="color:#e53935;border-color:rgba(229,57,53,.35);" onclick="deletePost('${p.id}')">🗑 글 삭제</button>` : ''}
      <div class="chat-box" id="chat-${p.id}" style="display:none;">
        <div class="chat-head"><span class="chat-title">팟 채팅</span></div>
        <div class="chat-messages" id="chatMessages-${p.id}"></div>
        <div class="chat-form">
          <input type="text" id="chatInput-${p.id}" placeholder="메시지 입력" maxlength="300" onkeydown="if(event.key==='Enter') sendMessage('${p.id}')">
          <button class="btn" onclick="sendMessage('${p.id}')">전송</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function setDefaultDeadline() {
  const el = document.getElementById('bDeadline');
  if (!el || el.value) return;
  const d = new Date(Date.now() + 60 * 60 * 1000);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  el.value = d.toISOString().slice(0,16);
}
setDefaultDeadline();
updateLoginStatus();

function showToast(msg, err = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}


// Initial render
restoreActiveTab();
renderAllStores();
</script>
